# 全胜。恒定 0.873 后系统回撤已等于池子(等权全A)自身回撤 -41.78%, 集中度成本中性化。
# 注: 2 万本金下 0.873 实际只投出约 61% 的钱(整手粒度+行业上限), 单只预算约 2900 元。
# 再降档(0.70/0.60)收益让渡大且落入整手粒度伪影区, 见 scan_const_weight.py。
regime_equity_weight:
  aggressive:
    attack: 0.873
    neutral: 0.873
    defense: 0.873
  balanced:
    attack: 0.8
    neutral: 0.65
    defense: 0.5
  conservative:
    attack: 0.5
    neutral: 0.35
    defense: 0.2
email:
  enabled: true
  smtp_server: smtp.qq.com
  smtp_port: 465
  sender: 2781740047@qq.com
  auth_code: ''
  recipients:
  - 2781740047@qq.com
dynamic:
  # 2026-09-24 用户拍板开启（此前为 false ⇒ 动态监控静默停摆 20 天，signal 表停在 20260904）。
  # 依据：临时副本库试跑（20260924）⇒ 20 条信号全为 buy_candidate、has_action=False、
  # 持仓 5 只体检全通过（无止损/弱势/停牌/ST）⇒ 无风险动作。
  # ⚠️ 关闭的代价：止损 / ST·停牌预警 / 弱势替换全部失效（持仓亏 -15% 无提醒）。
  # ⚠️ 已知：候选名单不看市场状态 ⇒ defense 状态下仍会推 buy_candidate（只"看"不"动"）。
  enabled: true
  stop_loss: -0.15
  weak_pct: 40
  swap_drawdown: -0.08
  candidate_top: 20
  min_hold_days: 3
  weak_confirm_days: 2
  cooldown_days: 5
paper:
  slip: 0.001
  open_exec: true
  paused: false
  # 2026-09-25: 账户级回撤治理(决策函数, app/portfolio/governor.py) —— 净值自峰值
  # 回撤 ≤ dd_trip(-20%) 触发「谨慎态」: 月度方案停补仓、候选替换买入停, 卖出照常;
  # 回升 ≥ dd_reset(-10%) 自动解除(滞回带, 纯函数可复算, 无持久状态)。
  # ⚠️ 2026-09-25 A/B 判决(scripts/ab_governor_overlay.py, experiments/
  # governor_overlay_ab_20260925.json): 月盘口径下**判否停用** —— 治理臂系统线年化
  # 14.97%→2.21%(-12.76pp)、MDD -22.80%→-24.33%(反而恶化), 机制 = 月换手 89.5% 下
  # 「停买+退出照旧」≈ 1~2 个月清仓成现金 ⇒ 回撤冻结在触发位、-10% 解除线不可达
  # (20240531 触发后至窗口末 28 期未解除); 时限版(gov3, 封 3 期)年化代价 -0.30pp
  # 但 MDD 仍恶化 -1.53pp —— 治理器以压回撤为存在意义, 回撤反而更差 ⇒ 两变体皆否。
  # 月盘的风险层 = 逐票 -15% 止损(dynamic); defense 候选闸(同日上线)不受本开关影响。
  governor:
    enabled: false
    dd_trip: -0.20
    dd_reset: -0.10
fees:
  commission_rate: 0.00025
  min_commission: 5.0
  stamp_tax: 0.0005
  stamp_tax_before: 0.001
  # 2026-09-13: 曾写作 `1e-05`（YAML 1.1 下不被认成 float ⇒ 变字符串；`save_config` 的
  # ruamel round-trip 恰好会写回这种写法）—— 装载器已改用 `_ConfigLoader` 容错，
  # 这里仍写小数，人读与 diff 都更清楚。详见 docs/know/07 号 #21。
  transfer_fee: 0.00001
weekly:
  enabled: true
  email: true
  capital: 1000000
  equity_weight: 1.0
  # 2026-09-22（结项审计）：以下三键原先**只存在于 `app/config.py` 的 DEFAULT_CONFIG**，
  # 本文件里没有 ⇒ 走默认值。补进来是为了"显式化"：换机 / 手删 / 人工 review 时能看见
  # 当前生效值，而不是靠翻源码。
  # ⚠️ 值必须与 DEFAULT_CONFIG **逐字一致且类型正确**（`1.5` 非 `"1.5"`、`true` 非 `yes`、
  #    `{}` 非 `null`）—— 因为 `config_sha16` 按**合并后的生效 dict** 算（`app/weekly/plan.py`
  #    的 `artifact_meta`），值不同就会换指纹。等值补键 = 空操作，**不换 pin、不判漂移**。
  max_lot_cost_mult: 1.5      # plan.build 的兜底
  risk_halt:
    enabled: true             # risk.py / doctor.py 的兜底（默认开）
    # 2026-09-28（用户拍板"改成自动解除"）：停买中且健康档读到 **healthy** ⇒ 19:45 档自动
    # 解除（risk.maybe_auto_resume，账本 halt 记录带 auto=True 留痕；成功/落账失败都发
    # 运维告警）。滞回：触发要 degrading/dead、解除要严格更好的 healthy，warning 不解除。
    # DEFAULT_CONFIG 缺省 false = 旧"只人工 resume"口径（测试/新装机不变）。
    # ⚠️ 新增键换 plan.meta.config_sha16（整个 weekly 子字典进 sha），预期内。
    auto_resume: true
  shape: {}                   # 显式覆盖 pick_shape(top_n/band/hold_bonus)；空 = 按资金自动
  # 2026-09-25: 袖套版回撤治理(app/weekly/risk.py::governor) —— 净值自峰值回撤
  # ≤ dd_trip 停开新仓(退出照旧), 回升 ≥ dd_reset 自动解除。w=1.0 生产构型
  # MDD -36.6%(F52) ⇒ -20% 触发。⚠️ 新增键会换 plan.meta.config_sha16(预期内)。
  # ✅ 2026-09-25 A/B 判决(scripts/ab_governor_overlay.py): 袖套口径下**采纳保留** ——
  # 治理臂年化 20.19%→17.05%(-3.14pp/年 = 保费), MDD -38.44%→-24.69%(改善 13.75pp)、
  # 日频 MDD -46.51%→-25.56%(改善 20.95pp), 收益/回撤比 0.53→0.69; 两次触发均正常解除
  # (band=8 留存持仓 ⇒ 谨慎期组合不散架、解除线可达 —— 与月盘的清仓陷阱机制相反)。
  governor:
    enabled: true
    dd_trip: -0.20
    dd_reset: -0.10

# 2026-09-22（结项审计）：同上 —— 这两个顶层键原先只在 DEFAULT_CONFIG 里。
# 两者默认均为**关闭**（fail-safe）。注意 `regime_style_guard` / `framework`
# **不在** `config_sha16` 的子集内（子集 = weekly / fees / regime_equity_weight /
# single_side_cost / benchmark），所以它们怎么改都不动指纹。
regime_style_guard:
  enabled: false              # 开启后池子分支用同一套规则并行计算
  mode: worse                 # worse = 取更防守的一路（只加防守，不放松进攻）
framework:
  enabled: false              # 框架阶段（factory/pipeline/fusion/optimizer/health）总开关
  stages:
    factory: false
    pipeline: false
    fusion: false
    optimizer: false
    health: false
  alpha_tables: {}
  die_tables: {}
  ens_table: model_score_ens
  investable: 0
  round_trip_target: 0.005
  others_tables:
    - model_score
  market_since: null          # 缺省取 eval_start；只影响框架阶段，不碰生产
# 建仓追高剔除闸(2026-09-26 用户拍板采纳; 单一实现 app/portfolio/chase.py):
# 最终 top-n 候选中 chase_z = max(z(mom5), z(devvwap)) > theta 的票剔除、不补位 ——
# 三轮预注册 A/B: 85 期 +2.07pp/全史 +1.47pp(θ=2.0), 剂量曲线稳健, min60 原信号不反
# (05 号台账 七补/九补; 判据/证据链见 plans/risk-overlay、chase6-fullhist、chase6-round3 三预注册)。
# DEFAULT_CONFIG 缺省 False —— 本键为生产的显式开启。
chase:
  enabled: true
  theta: 2.0  # 剔除阈值(冻结 2.0, 剂量曲线见 05 号 九补)

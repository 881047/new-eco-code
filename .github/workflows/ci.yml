# 单元测试 CI (2026-09-04 审查 P3-5 建议): 推送/PR 时全量跑 unittest
# 测试使用临时库+mock, 不触碰实库、不发网络请求
#
# 2026-09-12 审查 P1-08 修复:
#   1) 依赖清单原缺 deap/cvxpy, 而 tests/test_factory.py 与 tests/test_optimizer.py
#      直接 import 它们(前者在 setUpClass 裸 import, 无 try 保护) ⇒ 每个 job 必然
#      ERROR, 这两个模块在 CI 上等同零验证。已补进 requirements-lock.txt。
#      torch 仍**不入锁**: seq_die 已判否, 且 CPU 轮子 1~2GB —— tests/test_seq_die.py
#      用 skipTest 优雅跳过, 故下面的守卫给 skip 留了额度。
#   2) 加 skip 数守卫: 依赖缺失被静默跳过是"绿灯假象"的主要来源, 超额度即失败。
#   3) 加 windows-latest job: 实际部署就是 Windows(start.bat / .venv\Scripts /
#      GBK 控制台编码), ubuntu-only 的 CI 永远发现不了那一类缺陷。
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
      - name: Show optional deps present
        run: python -c "import importlib.util as u; print({m: bool(u.find_spec(m)) for m in ('deap','cvxpy','torch')})"
      - name: Run unit tests
        run: python scripts/ci_run_tests.py
